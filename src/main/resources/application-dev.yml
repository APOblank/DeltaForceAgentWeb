spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/delta-force-stats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

delta-force:
  neo4j:
    password: ${NEO4J_PASSWORD:CHANGE_ME}
  security:
    jwt-secret: ${JWT_SECRET:${random.uuid}${random.uuid}}

