server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: delta-force-agent-web
  profiles:
    default: local
  datasource:
    # 默认使用项目 data/ 目录下的内嵌数据库；生产环境可通过环境变量切换 PostgreSQL。
    url: ${STATS_DATABASE_URL:jdbc:h2:file:./data/delta-force-stats;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${STATS_DATABASE_USER:sa}
    password: ${STATS_DATABASE_PASSWORD:}
    driver-class-name: ${STATS_DATABASE_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  jackson:
    default-property-inclusion: non_null

delta-force:
  fastapi:
    base-url: http://127.0.0.1:8000
    api-key: ""
    model: DF_agent
  realtime-data:
    base-url: http://127.0.0.1:8010
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: CHANGE_ME
    database: sjzdata
    user-database: deltaforceusers
    # 个人战绩专用多租户数据库；所有查询仍必须通过 JWT userId 做租户隔离。
    stats-database: sjzuserdata
    # 首次切换时将旧 H2/PostgreSQL 战绩幂等迁移到 Neo4j，完成后写入迁移标记。
    stats-migration-enabled: true
  security:
    # 生产环境必须替换为至少 32 位的高强度随机密钥，并妥善保管。
    jwt-secret: CHANGE_ME_TO_A_LONG_RANDOM_JWT_SECRET_32_CHARS
    jwt-ttl-seconds: 86400
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://127.0.0.1:8080,http://localhost:8080}
  data:
    firearms: classpath:data/orzice_firearms.json
    attachments: classpath:data/orzice_attachments.json

logging:
  level:
    com.deltaforce.agentweb: INFO
