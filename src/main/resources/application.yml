server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: delta-force-agent-web
  profiles:
    default: local
  jackson:
    default-property-inclusion: non_null

delta-force:
  fastapi:
    base-url: http://127.0.0.1:8000
    api-key: ""
    model: DF_agent
  realtime-data:
    base-url: http://127.0.0.1:8010
  neo4j:
    uri: bolt://localhost:7687
    user: neo4j
    password: CHANGE_ME
    database: sjzdata
    user-database: deltaforceusers
  security:
    # 生产环境必须替换为至少 32 位的高强度随机密钥，并妥善保管。
    jwt-secret: CHANGE_ME_TO_A_LONG_RANDOM_JWT_SECRET_32_CHARS
    jwt-ttl-seconds: 86400
  data:
    firearms: classpath:data/orzice_firearms.json
    attachments: classpath:data/orzice_attachments.json

logging:
  level:
    com.deltaforce.agentweb: INFO
